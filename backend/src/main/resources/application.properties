spring.application.name=userhub
server.port=8080

# H2 in-memory database (resets on every restart)
spring.datasource.url=jdbc:h2:mem:userhubdb
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Default administrator created at startup by DataSeeder (change if you like)
userhub.admin.fullName=System Administrator
userhub.admin.email=admin@userhub.com
userhub.admin.password=Admin@12345
